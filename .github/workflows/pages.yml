name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Conferir e preparar o site
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Preparar Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Conferir a árvore declarada sem scripts de instalação
        run: npm ci --ignore-scripts
      - name: Testar núcleo, arquivos e distribuição
        run: npm test
      - name: Gerar o site estático
        run: npm run build
      - name: Conferir arquivos e integridade
        run: npm run check
      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Preparar somente os arquivos permitidos de dist
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar o artefato conferido
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
